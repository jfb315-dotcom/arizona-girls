<meta charset="utf-8">
<title>Arizona Girls</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="AZ Girls">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: a winter-night sky behind translucent tiles (same idea as John's home panel); every game opens full screen with one big Back button. */
:root{
  --night:#0e1f3d; --night2:#24477a; --snow:#f6f9ff; --ink:#13213a; --muted:#b9c7e2;
  --candy:#e8424f; --gold:#ffc94a; --mint:#41c9a0; --sky:#7aa7ff; --pink:#ff8fb1; --plum:#b07cff;
  --glass:rgba(255,255,255,.12); --glass2:rgba(255,255,255,.22); --line:rgba(255,255,255,.24);
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:#1b1340;background-image:linear-gradient(180deg,#110d2e 0%,#241a52 38%,#5a2f6e 66%,#b5546a 86%,#e98a5c 100%);background-attachment:fixed;color:var(--snow);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overflow-x:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#snow{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ---------- home ---------- */
#home{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.top{display:flex;align-items:center;gap:12px}
.top h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,40px);margin:0;line-height:1.05;letter-spacing:.2px;text-wrap:balance}
.top h1 small{display:block;font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}
.top .sp{flex:1}
.pill{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:800;font-size:15px;min-height:44px}
.pill:active{background:var(--glass2)}
#cd{font-weight:800;color:var(--muted);font-size:14px;text-align:right}
#cd b{color:var(--snow);font-family:var(--display);font-size:20px;font-weight:600}

.label{font-weight:900;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
#players{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pl{display:flex;align-items:center;gap:12px;text-align:left;background:var(--glass);border:2px solid var(--line);border-radius:22px;padding:12px 14px;min-height:84px;transition:transform .15s,background .15s}
.pl .av{font-size:44px;line-height:1;width:58px;height:58px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.14);flex:none}
.pl .tx{min-width:0}
.pl .pn{display:block;font-family:var(--display);font-weight:600;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pm{display:block;font-weight:800;font-size:14px;color:var(--muted)}
.pl .pm b{color:var(--gold)}
.pl.on{border-color:var(--pc);background:rgba(255,255,255,.2);transform:translateY(-2px);box-shadow:0 0 0 4px rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.25)}
.pl.on .av{background:var(--pc)}

#cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:900;font-size:16px;min-height:48px}
.cat.on{background:var(--snow);color:var(--ink);border-color:var(--snow)}
#tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:14px}
.tile{position:relative;text-align:left;border-radius:24px;padding:16px 16px 14px;min-height:170px;display:flex;flex-direction:column;background:var(--tc);color:var(--ink);box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),0 6px 18px rgba(0,0,0,.25);transition:transform .12s;overflow:hidden}
.tile:active{transform:scale(.97)}
.tile .em{font-size:56px;line-height:1;margin-bottom:auto}
.tile .nm{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;margin-top:10px}
.tile .bl{font-weight:800;font-size:14px;line-height:1.3;opacity:.78;margin-top:4px}
.tile .tag{position:absolute;right:12px;top:12px;font-weight:900;font-size:11px;letter-spacing:1px;text-transform:uppercase;background:rgba(255,255,255,.55);border-radius:999px;padding:4px 9px}
.tile .tlv{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tile .tlv i{font-style:normal;font-weight:900;font-size:13px;color:#fff;border-radius:999px;padding:3px 8px;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.lvup{font-weight:900;font-size:20px;margin:6px 0 12px;padding:10px 14px;border-radius:14px;background:linear-gradient(90deg,#ffd36e,#ff8fb1);color:#2b1d55}
.lvup.dim{background:rgba(255,255,255,.15);color:inherit;font-size:16px}
.shelf{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 12px 8px}
.bdg{display:inline-flex;flex-direction:column;align-items:center;width:66px;font-size:11px;font-weight:800;line-height:1.1;text-align:center}
.bdg img,.bdg b{width:56px;height:56px;border-radius:50%;border:3px solid #ffc94a;box-shadow:0 2px 6px rgba(0,0,0,.35);background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:24px;object-fit:cover}
.bdg:not(.on) b{border-color:rgba(255,255,255,.35);opacity:.7}
.bdg small{margin-top:4px;opacity:.85}
.bdg.big{width:auto}.bdg.big img{width:96px;height:96px;border-width:4px;animation:bpop .7s ease-out}
.newbdg{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 14px;font-weight:900;font-size:22px;text-align:left}
.newbdg small{font-size:14px;opacity:.8}
@keyframes bpop{0%{transform:scale(.2) rotate(-30deg)}70%{transform:scale(1.15) rotate(6deg)}100%{transform:none}}
.wlearn{background:var(--snow);color:var(--ink);border-radius:26px;padding:18px 22px 20px;max-width:640px;width:100%;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 14px 40px rgba(0,0,0,.35);border-top:8px solid var(--mint)}
.wlearn.no{border-top-color:var(--candy)}
.wlh{font-weight:900;font-size:clamp(18px,2.4vw,22px)}
.wlpic{font-size:clamp(60px,11vh,96px);line-height:1}
.wlname{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.6vw,36px)}
.wlclue{font-weight:700;font-size:17px;opacity:.75}
.wlfact{font-weight:700;font-size:clamp(17px,2.2vw,20px);line-height:1.4;background:#fff4d6;border-radius:16px;padding:12px 14px;text-align:left}
.wnext{margin-top:6px}
.wgh{position:absolute;left:0;right:0;top:10px;text-align:center;font-family:var(--display);font-size:clamp(20px,3vw,30px);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5);pointer-events:none}
.wpic{font-size:clamp(70px,14vh,130px);line-height:1}
.wclue{font-size:clamp(22px,3.4vw,36px)}
.wfact{min-height:1.4em;font-weight:800;font-size:clamp(16px,2.2vw,22px);text-align:center;max-width:820px}
.wreg{max-width:760px}.wrg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 16px}
.wrg button{background:var(--snow);color:var(--ink);border-radius:18px;padding:12px 8px;font-weight:900;font-size:16px;line-height:1.15;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.wrg button span{display:block;font-size:36px;margin-bottom:4px}.wrg button small{display:block;font-size:12px;opacity:.65;margin-top:3px}
.wrg button.home{background:linear-gradient(135deg,#ffd36e,#ff8f6b)}
@media (max-width:600px){.wrg{grid-template-columns:repeat(2,1fr)}}
.tile .tag.both{background:var(--ink);color:var(--snow)}
.foot{color:var(--muted);font-weight:700;font-size:13px;margin-top:22px;text-align:center}

/* settings sheet */
#sheet,#sheet2{position:fixed;left:0;top:0;width:100%;height:100%;z-index:50;background:rgba(5,12,28,.7);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
#sheet .card,#sheet2 .card{max-width:560px;width:100%}
.edrow{display:flex;align-items:center;gap:10px;margin:10px 0}
.edrow .avb{font-size:36px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.12);flex:none}
.edrow input{flex:1;min-width:0;font:800 18px var(--body);padding:12px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.08);color:var(--snow)}
.edrow select{font:800 18px var(--body);padding:12px 8px;border-radius:14px;border:2px solid var(--line);background:#1b335c;color:var(--snow)}

/* ---------- game stage ---------- */
#stage{position:fixed;left:0;top:0;width:100%;height:100%;z-index:10;display:flex;flex-direction:column;background:var(--stagebg,linear-gradient(180deg,#0b1834,#1a3765));padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
.bar{display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));flex:none}
.back{background:var(--snow);color:var(--ink);border-radius:999px;font-weight:900;font-size:18px;padding:12px 20px;min-height:52px}
#gTitle{font-family:var(--display);font-weight:700;font-size:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:900;font-size:15px;min-height:46px;white-space:nowrap}
#gScore{font-family:var(--display);font-weight:600;font-size:22px;white-space:nowrap}
.gbody{flex:1;position:relative;overflow:hidden;touch-action:none;min-height:0}
.cv{position:absolute;left:0;top:0;display:block}

.ready,.done{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(5,12,28,.55);z-index:20;padding:16px;box-sizing:border-box}
.card{background:#fdfcff;color:var(--ink);border-radius:28px;padding:24px 26px;text-align:center;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);max-height:100%;overflow:auto;box-sizing:border-box}
.card h2{font-family:var(--display);font-size:32px;margin:0 0 6px}
.card p{font-weight:800;font-size:18px;line-height:1.4;margin:8px 0 16px;color:#3b4763}
.card .em{font-size:64px;line-height:1}
.btn{background:#e9eef8;color:var(--ink);border-radius:999px;padding:14px 26px;font-weight:900;font-size:20px;min-height:58px;margin:6px}
.btn.go{background:var(--candy);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.4}
.stars{font-size:64px;letter-spacing:6px;margin:6px 0}
.stars span{color:#d8deea;display:inline-block}
.stars span.on{color:var(--gold);animation:pop .5s both}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.pick{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:10px 0}
.pick button{border:3px solid #d8deea;border-radius:20px;padding:10px 14px;min-width:120px;font-weight:900;font-size:16px;background:#f2f5fb}
.pick button span{display:block;font-size:40px}
.pick button.on{border-color:var(--pc);background:var(--pc);color:#fff}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.shake{animation:shake .4s}

/* match */
.mgrid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;gap:12px}
.mc{perspective:600px;padding:0}
.mc .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.mc.up .in,.mc.got .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:18px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mc .b{background:radial-gradient(circle at 35% 30%,#ff7b86,var(--candy) 55%,#a81f30);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.mc .b:before{content:"";width:28%;height:28%;border-radius:50%;border:4px solid rgba(255,255,255,.55)}
.mc .f{background:#fdfcff;transform:rotateY(180deg);font-size:min(9vh,9vw)}
.mc.got .f{background:#d9f7ec}

/* quiz + math */
.qwrap{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 20px 24px;box-sizing:border-box;gap:14px}
.qwho{font-weight:900;font-size:18px;color:var(--muted)}
.qwho b{color:var(--snow)}
.qtext{font-family:var(--display);font-weight:600;font-size:clamp(26px,4.2vw,44px);text-align:center;max-width:900px;line-height:1.2;text-wrap:balance}
.qpic{font-size:clamp(34px,6vw,64px);letter-spacing:4px;text-align:center;line-height:1.2;max-width:900px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:820px}
.opt{background:var(--snow);color:var(--ink);border-radius:22px;padding:16px;min-height:84px;font-weight:900;font-size:clamp(20px,2.8vw,28px);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.opt.ok{background:var(--mint);color:#fff}
.opt.no{background:var(--candy);color:#fff}
.prog{display:flex;gap:6px}
.prog i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.2)}
.prog i.ok{background:var(--mint)}.prog i.no{background:var(--candy)}.prog i.now{background:var(--snow)}

/* simon */
.sgrid{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);display:grid;grid-template-columns:1fr 1fr;gap:18px;width:min(78vh,90vw);height:min(66vh,76vw)}
.sp{border-radius:40px;opacity:.38;transition:opacity .08s,transform .08s;box-shadow:inset 0 -10px 0 rgba(0,0,0,.2)}
.sp.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 50px currentColor,inset 0 -10px 0 rgba(0,0,0,.2)}
.smsg{position:absolute;left:0;right:0;top:12px;text-align:center;font-family:var(--display);font-weight:600;font-size:28px}

/* word */
.wslots,.wtiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.ws,.wt{width:min(9vw,76px);height:min(9vw,76px);min-width:48px;min-height:48px;border-radius:16px;font-family:var(--display);font-weight:700;font-size:min(5.5vw,42px);display:flex;align-items:center;justify-content:center}
.ws{border:3px dashed rgba(255,255,255,.5)}
.ws.f{border-style:solid;background:var(--gold);color:var(--ink);border-color:var(--gold)}
.wt{background:var(--snow);color:var(--ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.wt.used{visibility:hidden}
.wrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* code breaker */
.cb{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;gap:18px;padding:8px 18px 18px;box-sizing:border-box}
.cbrows{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-width:0}
.cbr{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:16px;padding:6px 10px}
.cbr.cur{background:rgba(255,255,255,.18)}
.peg{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.3);box-sizing:border-box;flex:none}
.fb{display:flex;gap:4px;margin-left:auto;align-items:center;font-weight:900;font-size:14px}
.fb i{width:16px;height:16px;border-radius:50%;display:inline-block}
.fb i.x{background:var(--mint)} .fb i.c{background:transparent;border:3px solid var(--gold);box-sizing:border-box}
.cbside{width:260px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.cbpal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cbpal button{height:70px;border-radius:20px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.cbkey{font-weight:800;font-size:14px;color:var(--muted);line-height:1.5}
.cbkey i{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:4px}

/* slide puzzle */
.sbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.1);border-radius:22px;padding:10px}
.st{position:absolute;border-radius:16px;font-family:var(--display);font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;transition:left .12s,top .12s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);text-shadow:0 2px 0 rgba(0,0,0,.2)}

/* whack */
.wgrid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;gap:16px}
.hole{position:relative;border-radius:50%;overflow:hidden;background:radial-gradient(ellipse at 50% 80%,#0a1428 40%,#1d3866 41%,#2b4f86 70%)}
.hole .who{position:absolute;left:0;right:0;bottom:-100%;text-align:center;transition:bottom .12s;line-height:1}
.hole.up .who{bottom:6%}
.hole.hit{background:radial-gradient(ellipse at 50% 80%,#0a1428 40%,#41c9a0 41%,#2b4f86 75%)}

/* draw */
.dtools{position:absolute;left:0;top:0;bottom:0;width:116px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:center;gap:8px;padding:6px 0 10px 12px;box-sizing:border-box;overflow:auto}
.dtools button{width:46px;height:46px;border-radius:14px;font-size:24px;background:var(--glass);border:3px solid transparent}
.dtools button.on{border-color:var(--snow)}
.dpaper{position:absolute;left:124px;top:0;right:14px;bottom:14px;border-radius:20px;overflow:hidden;background:#fff}

/* snowman */
.snow{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;gap:14px;padding:0 16px 16px;box-sizing:border-box}
.snow svg{flex:1;min-width:0;height:100%;border-radius:24px}
.sctl{width:300px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:center}
.sctl button{background:var(--snow);color:var(--ink);border-radius:20px;min-height:66px;font-weight:900;font-size:17px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.sctl button span{display:block;font-size:26px}
.sctl .wide{grid-column:span 2;background:var(--gold)}

/* keys */
.keys{position:absolute;left:16px;right:16px;bottom:16px;top:84px;display:flex;gap:10px;align-items:flex-start;justify-content:center}
.key{flex:1;max-width:120px;border-radius:24px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;box-sizing:border-box;font-family:var(--display);font-weight:700;font-size:28px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:inset 0 -8px 0 rgba(0,0,0,.2);transition:transform .08s,filter .08s}
.key.dn{transform:translateY(6px);filter:brightness(1.25)}
.key.nx{outline:6px solid #fff;outline-offset:3px;animation:bob .7s infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.ktop{position:absolute;left:0;right:0;top:12px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.ktop .chip.on{background:var(--snow);color:var(--ink)}

/* race */
.race{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;gap:12px;padding:0 14px 14px;box-sizing:border-box}
.lane{flex:1;display:flex;flex-direction:column;gap:10px;border-radius:24px;background:rgba(255,255,255,.07);padding:10px;min-width:0}
.lane .ln{font-family:var(--display);font-weight:600;font-size:20px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{flex:1;position:relative;border-radius:18px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 24px,transparent 24px 48px);overflow:hidden}
.track .fin{position:absolute;left:0;right:0;top:0;height:14px;background:repeating-linear-gradient(90deg,#fff 0 14px,#13213a 14px 28px)}
.track .rd{position:absolute;left:50%;font-size:54px;line-height:1;transform:translate(-50%,50%) scaleX(-1);transition:bottom .08s}
.tapb{height:min(26vh,190px);border-radius:24px;font-family:var(--display);font-weight:700;font-size:34px;color:#fff;box-shadow:inset 0 -8px 0 rgba(0,0,0,.2)}
.tapb:active{filter:brightness(1.2)}
.need{font-weight:800;font-size:14px;color:var(--muted);text-align:center}
.big321{position:absolute;left:0;right:0;top:35%;text-align:center;font-family:var(--display);font-weight:700;font-size:140px;z-index:5;pointer-events:none;text-shadow:0 6px 30px rgba(0,0,0,.5)}

/* spinner + dance */
.center{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 16px 16px;box-sizing:border-box;text-align:center}

/* ---------- worlds ---------- */
#worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.world{position:relative;overflow:hidden;border-radius:30px;min-height:min(31vh,260px);padding:18px 20px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;color:#fff;background:var(--wbg);box-shadow:inset 0 -10px 0 rgba(0,0,0,.18),0 10px 24px rgba(0,0,0,.25);transition:transform .12s}

.world .pat{position:absolute;left:0;top:0;right:0;bottom:0;opacity:.17;font-size:38px;letter-spacing:12px;line-height:1.6;word-break:break-all;padding:10px;pointer-events:none;overflow:hidden}
.world .we{position:absolute;right:14px;top:8px;font-size:clamp(60px,9vw,92px);line-height:1}

#wview{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}

.starrow{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:18px;padding:10px 12px;margin:8px 0}

.starrow .nm{flex:1;font-family:var(--display);font-size:22px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* who's playing card */
.whob{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.whob button{border-radius:24px;padding:14px 8px;background:var(--pc);color:#fff;font-weight:900;font-size:17px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);min-height:150px}
.whob button span{display:block;font-size:60px;line-height:1.1}
.whob button small{display:block;font-size:13px;opacity:.9}

/* memory pads with emoji */
.sp{font-size:min(12vh,84px)}
.srow{position:absolute;left:16px;right:16px;bottom:16px;height:26%;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.srow .sp{border-radius:28px;font-size:min(8vh,54px)}
.charm{position:absolute;left:0;right:0;top:56px;bottom:calc(26% + 26px);display:flex;align-items:flex-end;justify-content:center}
.charm .pot{position:relative;width:220px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.charm .rise{position:relative;width:180px;height:70%;overflow:hidden;margin-bottom:-40px}
.charm .sn{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:min(20vh,140px);line-height:1;transition:transform .6s;transform:translateY(100%)}
.charm .sn.dance .s{display:inline-block;animation:sway 1s infinite alternate ease-in-out}

.charm .bk{font-size:min(22vh,160px);line-height:1;position:relative;z-index:2}

/* quiz pictures */
.qpic svg{width:min(32vh,240px);height:auto;display:block;margin:0 auto}

/* snake */
.dpad{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:216px;height:216px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px}

.dp.u{grid-column:2;grid-row:1}.dp.l{grid-column:1;grid-row:2}.dp.r{grid-column:3;grid-row:2}.dp.d{grid-column:2;grid-row:3}

/* snakes & ladders */

/* bracelet */
.beads{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:16px 10px;position:relative;max-width:960px}

.bpal button{width:76px;height:76px;border-radius:50%;box-shadow:inset -8px -10px 0 rgba(0,0,0,.18),inset 8px 8px 0 rgba(255,255,255,.35)}

.ring .bead{position:absolute;transform:translate(-50%,-50%)}

function pool(bank){var p={};return function(l){if(!p[l]||!p[l].length)p[l]=shuffle(bank[l]);return p[l].pop();};}
function runQuiz(el,sel,per,makeQ){
  if(sel.length===1){cur=sel[0];save();}
  var turns=[],pts={},n=0;sel.forEach(function(i){pts[i]=0;});
  for(var r=0;r<per;r++)sel.forEach(function(i){turns.push(i);});
  var w=h("div","qwrap");el.appendChild(w);
  function sb(){score(sel.length>1?sel.map(function(i){return players[i].av+" "+pts[i];}).join("  "):"✅ "+pts[sel[0]]);}
  function next(){
    if(n>=turns.length)return end();
    var who=turns[n],q=makeQ(lvlFor(players[who])),opts=shuffle([q.a].concat(q.wrong));
    w.innerHTML="<div class='qwho'>"+(sel.length>1?AVH(players[who])+" <b>"+esc(players[who].name)+"</b>'s turn":"Question "+(n+1)+" of "+turns.length)+"</div><div class='qpic'>"+(q.pic||"")+"</div><div class='qtext'>"+esc(q.q)+"</div><div class='opts'></div>";
    var box=w.querySelector(".opts"),done=false;
    opts.forEach(function(o){var b=h("button","opt",esc(o));b.addEventListener("click",function(){if(done)return;done=true;
      if(o===q.a){b.classList.add("ok");pts[who]++;sfx.good();}else{b.classList.add("no");sfx.bad();[].forEach.call(box.children,function(x){if(x.textContent===q.a)x.classList.add("ok");});}
      sb();n++;later(next,o===q.a?1100:2100);});box.appendChild(b);});
  }
  function end(){
    if(sel.length===1){var p=pts[sel[0]],f=p/per;finish({stars:f>=0.85?3:f>=0.65?2:f>=0.4?1:0,msg:p+" out of "+per+" right."});return;}
    var best=Math.max.apply(null,sel.map(function(i){return pts[i];})),win=sel.filter(function(i){return pts[i]===best;});
    finish({stars:3,award:sel.map(function(i){return [i,win.indexOf(i)>=0?3:1];}),party:true,title:win.length>1?"It's a tie!":AVH(players[win[0]])+" "+esc(players[win[0]].name)+" wins!",msg:sel.map(function(i){return esc(players[i].name)+": "+pts[i];}).join(" · ")+"<br>Winners get 3 stars, everyone else gets 1."});
  }
  sb();next();
}
function arrQ(bank){var p=pool(bank);return function(l){var q=p(l);return {q:q[0],a:q[1],wrong:q[2],pic:q[3]};};}

var RYB={c:[[1,1,1],[1,0,0],[1,1,0],[1,.5,0],[.163,.373,.6],[.5,0,.5],[0,.66,.2],[.2,.094,0]]};
function ryb2rgb(r,y,b){var c=RYB.c,o=[];for(var k=0;k<3;k++){
  var c00=c[0][k]*(1-r)+c[1][k]*r,c01=c[4][k]*(1-r)+c[5][k]*r,c10=c[2][k]*(1-r)+c[3][k]*r,c11=c[6][k]*(1-r)+c[7][k]*r;
  var c0=c00*(1-y)+c10*y,c1=c01*(1-y)+c11*y;o.push(c0*(1-b)+c1*b);}return o;}
function paintMix(n){var p=n[0]+n[1]+n[2],tot=p+n[3]+n[4];if(!tot)return null;var rgb=[0,0,0];
  if(p){var m=Math.max(n[0],n[1],n[2]);rgb=ryb2rgb(n[0]/m,n[1]/m,n[2]/m);}var a=p/tot,w=n[3]/tot;
  return rgb.map(function(v){return Math.round(255*Math.max(0,Math.min(1,v*a+w)));});}
function rgbS(c){return c?"rgb("+c.join(",")+")":"transparent";}

  function same(a,b){var sa=sum(a),sb=sum(b);if(!sa)return false;for(var i=0;i<5;i++)if(a[i]*sb!==b[i]*sa)return false;return true;}

game({id:"jewels",name:"Jewel Match",em:"💎",bl:"Swap jewels to make rows of 3. Reach the goal in 20 moves.",tc:"#c9e6ff",levels:true,
start:function(el,L){
  var N=7,K=Math.min(6,P([5,5,6])),goal=P([35,45,60]),moves=20,got=0,busy=false,sel=-1,b=[];
  var J=["💎","💖","⭐","🍀","🍊","🌙"];
  var w=h("div","n2wrap");el.appendChild(w);var msg=h("div","n2msg","");w.appendChild(msg);
  var r=el.getBoundingClientRect(),s=Math.floor(Math.min((r.width-40)/N,(r.height-110)/N,84)),g=h("div","n2grid jwg");g.style.gridTemplateColumns="repeat("+N+","+s+"px)";g.style.gridAutoRows=s+"px";w.appendChild(g);
  var cells=[];for(var i=0;i<N*N;i++){var c=h("div","jw");c.style.fontSize=(s*0.62)+"px";g.appendChild(c);cells.push(c);}
  function at(i){return b[i];}
  function runs(){var m={};for(var r0=0;r0<N;r0++)for(var c0=0;c0<N;c0++){var i=r0*N+c0,v=b[i];if(v<0)continue;
      if(c0<=N-3&&b[i+1]===v&&b[i+2]===v){m[i]=m[i+1]=m[i+2]=1;}
      if(r0<=N-3&&b[i+N]===v&&b[i+2*N]===v){m[i]=m[i+N]=m[i+2*N]=1;}}return Object.keys(m).map(Number);}
  function fill(){b=[];for(var i=0;i<N*N;i++){var v;do{v=rnd(0,K-1);}while((i%N>=2&&b[i-1]===v&&b[i-2]===v)||(i>=2*N&&b[i-N]===v&&b[i-2*N]===v));b.push(v);}if(!anyMove())fill();}
  function sw(i,j){var t=b[i];b[i]=b[j];b[j]=t;}
  function anyMove(){for(var i=0;i<N*N;i++){var nb=[];if(i%N<N-1)nb.push(i+1);if(i<N*N-N)nb.push(i+N);for(var k=0;k<nb.length;k++){sw(i,nb[k]);var ok=runs().length>0;sw(i,nb[k]);if(ok)return true;}}return false;}
  function draw(){cells.forEach(function(c,i){c.textContent=b[i]>=0?J[b[i]]:"";c.classList.toggle("sel",i===sel);});msg.textContent="Goal "+Math.min(got,goal)+" / "+goal+"   ·   Moves "+moves;score("💎 "+got);}
  function adj(i,j){return (Math.abs(i-j)===1&&Math.floor(i/N)===Math.floor(j/N))||Math.abs(i-j)===N;}
  function tryS(i,j){if(busy||G.done)return;busy=true;sel=-1;sw(i,j);draw();
    if(!runs().length){sfx.bad();later(function(){sw(i,j);draw();busy=false;},260);return;}
    moves--;cascade(0);}
  function cascade(depth){var m=runs();if(!m.length){if(!anyMove()){msg.textContent="No moves left. Shuffling!";later(function(){fill();draw();endCheck();},700);}else endCheck();return;}
    got+=m.length+(depth>0?depth:0);tone(500+depth*120,0.12,"triangle",0.18);m.forEach(function(i){cells[i].classList.add("pop");b[i]=-1;});
    later(function(){m.forEach(function(i){cells[i].classList.remove("pop");});
      for(var c=0;c<N;c++){var col=[];for(var r1=N-1;r1>=0;r1--)if(b[r1*N+c]>=0)col.push(b[r1*N+c]);for(r1=N-1;r1>=0;r1--){var k=N-1-r1;b[r1*N+c]=k<col.length?col[k]:rnd(0,K-1);}}
      draw();later(function(){cascade(depth+1);},200);},260);}
  function endCheck(){busy=false;draw();if(got>=goal){finish({stars:3,msg:"Goal reached with "+moves+" move"+(moves===1?"":"s")+" to spare!"});return;}
    if(moves<=0)finish({stars:got>=goal*0.75?2:got>=goal*0.5?1:0,msg:"You cleared "+got+" of "+goal+" jewels."});}
  var d0=null;
  function cellAt(p){var gr=g.getBoundingClientRect(),er=el.getBoundingClientRect(),x=p.x+er.left-gr.left,y=p.y+er.top-gr.top;if(x<0||y<0||x>=gr.width||y>=gr.height)return -1;return Math.min(N-1,Math.floor(y/(gr.height/N)))*N+Math.min(N-1,Math.floor(x/(gr.width/N)));}
  ptr(el,{down:function(p){var i=cellAt(p);if(i<0||busy)return;d0={i:i,x:p.x,y:p.y};},
    move:function(p){if(!d0)return;var dx=p.x-d0.x,dy=p.y-d0.y;if(Math.max(Math.abs(dx),Math.abs(dy))>s*0.45){var i=d0.i,j=Math.abs(dx)>Math.abs(dy)?(dx>0?i+1:i-1):(dy>0?i+N:i-N);d0=null;if(j>=0&&j<N*N&&adj(i,j))tryS(i,j);}},
    up:function(p){if(!d0)return;var i=d0.i;d0=null;if(sel>=0&&sel!==i&&adj(sel,i))tryS(sel,i);else{sel=sel===i?-1:i;sfx.tick();draw();}}});
  fill();draw();
  ready(el,{em:"💎",title:"Jewel Match",text:"Swipe a jewel, or tap two jewels side by side, to swap them. Line up 3 or more of the same to clear them. Clear "+goal+" jewels in 20 moves for 3 stars."},function(){});
}});
